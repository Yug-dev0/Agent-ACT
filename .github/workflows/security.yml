name: Security & Health Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'

jobs:
  audit:
    name: Dependency & Config Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Environment Example
        run: |
          test -f .env.example
          grep -q "TRUEFORGE_PORT" .env.example
          grep -q "MCP_PORT" .env.example
